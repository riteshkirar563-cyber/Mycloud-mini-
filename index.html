<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCloud Mini</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{color-scheme:dark;--text:#eef2ff;--muted:#9aa9c7;--blue:#38bdf8;--purple:#818cf8}
body{min-height:100vh;background:radial-gradient(ellipse at 15% 8%,rgba(56,189,248,.17),transparent 34%),radial-gradient(ellipse at 88% 18%,rgba(129,140,248,.18),transparent 32%),linear-gradient(135deg,#070b18,#0b1024 48%,#11102b);background-size:160% 160%;animation:bgMove 16s ease infinite;color:var(--text);display:flex;justify-content:center;align-items:flex-start;padding:30px 14px}
@keyframes bgMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.card{width:100%;max-width:510px;background:linear-gradient(145deg,rgba(18,28,52,.94),rgba(10,16,34,.94));backdrop-filter:blur(22px);border:1px solid rgba(125,160,255,.2);border-radius:26px;padding:30px 26px;height:fit-content;box-shadow:0 24px 80px rgba(0,0,0,.42),0 0 38px rgba(56,189,248,.07),inset 0 1px 0 rgba(255,255,255,.04);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,#38bdf8,#818cf8,transparent);opacity:.8}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo-icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#38bdf8,#6366f1 70%,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(56,189,248,.25);animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
h1{font-size:25px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(90deg,#fff,#bae6fd 58%,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:24px}
input{width:100%;padding:14px 16px;margin:7px 0;background:rgba(5,10,25,.72);border:1px solid rgba(148,163,184,.22);border-radius:13px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus{border-color:#38bdf8;background:rgba(7,16,35,.95);box-shadow:0 0 0 3px rgba(56,189,248,.13),0 0 20px rgba(56,189,248,.07)}
input::placeholder{color:#72819f}
.btn{width:100%;padding:14px;margin:7px 0;border:1px solid transparent;border-radius:13px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s}
.btn-primary{background:linear-gradient(110deg,#0ea5e9,#4f7cff 55%,#8b5cf6);color:#fff;box-shadow:0 7px 22px rgba(59,130,246,.22)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(56,189,248,.3)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:rgba(148,163,184,.08);border-color:rgba(148,163,184,.16);color:#dbeafe}
.btn-ghost:hover{background:rgba(148,163,184,.14);border-color:rgba(125,211,252,.3)}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(148,163,184,.25),transparent);margin:21px 0}
.userbar{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:18px;background:linear-gradient(120deg,rgba(56,189,248,.1),rgba(129,140,248,.08));border:1px solid rgba(56,189,248,.23);border-radius:16px}
.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#6366f1);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;flex-shrink:0;box-shadow:0 4px 14px rgba(56,189,248,.18)}
.user-info{flex:1;min-width:0}.user-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-email{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.icon-btn{background:rgba(251,113,133,.1);color:#fda4af;border:1px solid rgba(251,113,133,.16);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}.icon-btn:hover{background:rgba(251,113,133,.18)}
.dropzone{border:1.5px dashed rgba(96,165,250,.46);border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;transition:.22s;margin-bottom:12px;background:radial-gradient(ellipse at center,rgba(56,189,248,.08),rgba(15,23,42,.18))}
.dropzone:hover,.dropzone.over{border-color:#38bdf8;background:rgba(56,189,248,.11);box-shadow:inset 0 0 26px rgba(56,189,248,.05),0 0 22px rgba(56,189,248,.08)}
.dropzone .dz-icon{font-size:36px;margin-bottom:9px;filter:drop-shadow(0 0 12px rgba(56,189,248,.35))}
.dropzone p{font-size:13px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}.dropzone .dz-file{color:#7dd3fc;font-weight:700}
.file-item{display:flex;align-items:center;gap:12px;padding:13px 12px;margin:9px 0;background:linear-gradient(110deg,rgba(15,23,42,.82),rgba(22,31,58,.68));border:1px solid rgba(148,163,184,.13);border-radius:15px;transition:border-color .2s,transform .2s,background .2s}
.file-item:hover{border-color:rgba(56,189,248,.32);transform:translateY(-1px);background:rgba(20,32,58,.9)}
.file-icon{font-size:23px;flex-shrink:0}.file-meta{flex:1;min-width:0}.file-name{font-size:13px;font-weight:600;color:#eaf2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-sub{font-size:11px;color:#8292b2;margin-top:4px}
.file-actions{display:flex;gap:6px;flex-shrink:0}.mini-btn{border:1px solid transparent;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.mini-dl{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.14);color:#7dd3fc}.mini-dl:hover{background:rgba(56,189,248,.24)}
.mini-del{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.13);color:#fda4af}.mini-del:hover{background:rgba(251,113,133,.22)}
.empty{text-align:center;color:#7f8eab;font-size:13px;padding:24px 10px;border:1px dashed rgba(148,163,184,.17);border-radius:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(100px);background:#0b1224;color:#e2e8f0;border:1px solid rgba(125,160,255,.25);padding:12px 22px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 35px rgba(0,0,0,.45),0 0 20px rgba(56,189,248,.08);transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:99;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.error{border-color:#fb7185;color:#fecdd3}.toast.success{border-color:#4ade80;color:#bbf7d0}
.hidden{display:none!important}footer{text-align:center;margin-top:20px;font-size:11px;line-height:1.5;color:#71809d}
@media(max-width:480px){body{padding:16px 10px}.card{padding:24px 17px;border-radius:22px}h1{font-size:23px}.sub{margin-bottom:20px}.file-item{gap:9px;padding:11px 9px}.file-actions{gap:4px}.mini-btn{padding:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-icon">☁️</div><div><h1>MyCloud Mini</h1></div></div>
  <p class="sub">Your personal cloud — store &amp; share files securely</p>
  <div id="authSection">
    <input id="name" type="text" placeholder="Your name" autocomplete="name">
    <input id="email" type="email" placeholder="Email address" autocomplete="email">
    <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <button class="btn btn-primary" id="signupBtn" onclick="signup()">Create account</button>
    <button class="btn btn-ghost" onclick="login()">Login</button>
  </div>
  <div id="appSection" class="hidden">
    <div class="userbar">
      <div class="avatar" id="avatar">?</div>
      <div class="user-info"><div class="user-name" id="userName">—</div><div class="user-email" id="userEmail">—</div></div>
      <button class="icon-btn" onclick="logout()">Logout</button>
    </div>
    <div class="dropzone" id="dropzone"><div class="dz-icon">📤</div><p id="dzText">Drag &amp; drop a file here<br>or <span class="dz-file">tap to browse</span></p></div>
    <input id="file" type="file" class="hidden">
    <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()">Upload file</button>
    <button class="btn btn-ghost" onclick="loadFiles()">↻ Refresh files</button>
    <div class="divider"></div>
    <p style="font-size:12px;color:#91a2c2;margin-bottom:8px;letter-spacing:1.2px;font-weight:700;">YOUR FILES</p>
    <div id="files"></div>
  </div>
  <footer>Learning prototype — do not upload sensitive files.</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const db = supabase.createClient(
  "https://nylpeijudbjzocdfiyqe.supabase.co",
  "sb_publishable_CPIurg7CNQRL2yVyyGb0cA_iQp5Sk21"
);
let user = null;
let selectedFile = null;
function toast(msg,type){
  const t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+(type||"");
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.className="toast",3200);
}
function showSection(){
  const loggedIn=!!user;
  document.getElementById("authSection").classList.toggle("hidden",loggedIn);
  document.getElementById("appSection").classList.toggle("hidden",!loggedIn);
  if(loggedIn){
    const name=user.user_metadata?.full_name||"";
    const email=user.email||"";
    document.getElementById("userName").textContent=name||email.split("@")[0];
    document.getElementById("userEmail").textContent=email;
    document.getElementById("avatar").textContent=(name||email)[0].toUpperCase();
  }
}
function formatBytes(b){
  if(!b&&b!==0)return "";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(1)+" MB";
}
function fileEmoji(name){
  const ext=name.split(".").pop().toLowerCase();
  if(["jpg","jpeg","png","gif","webp","svg"].includes(ext))return"🖼️";
  if(["mp4","mov","avi","mkv"].includes(ext))return"🎬";if(["mp3","wav","ogg","m4a"].includes(ext))return"🎵";
  if(["pdf"].includes(ext))return"📕";if(["doc","docx","txt","md"].includes(ext))return"📄";
  if(["xls","xlsx","csv"].includes(ext))return"📊";if(["zip","rar","7z","tar","gz"].includes(ext))return"📦";
  if(["js","html","css","py","java","json"].includes(ext))return"💻";return"📁";
}
function setUploadBtn(text,disabled){const b=document.getElementById("uploadBtn");b.textContent=text;b.disabled=disabled;}
async function init(){
  const {data}=await db.auth.getSession();user=data.session?.user||null;showSection();if(user)await loadFiles();
}
async function signup(){
  const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  if(!name)return toast("Please enter your name","error");
  const btn=document.getElementById("signupBtn");btn.disabled=true;btn.textContent="Creating account...";
  const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});
  btn.disabled=false;btn.textContent="Create account";if(error)return toast(error.message,"error");
  user=data.session?.user||null;showSection();if(user){toast("Account created! 🎉","success");await loadFiles();}else toast("Check your email to confirm, then log in.","success");
}
async function login(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const {data,error}=await db.auth.signInWithPassword({email,password});if(error)return toast(error.message,"error");
  user=data.user;showSection();toast("Welcome back! 👋","success");await loadFiles();
}
async function logout(){
  await db.auth.signOut();user=null;document.getElementById("files").innerHTML="";showSection();toast("Logged out","success");
}
const dz=document.getElementById("dropzone"),fileInput=document.getElementById("file");
dz.addEventListener("click",()=>fileInput.click());
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");if(e.dataTransfer.files.length){fileInput.files=e.dataTransfer.files;showSelectedFile();}});
fileInput.addEventListener("change",showSelectedFile);
function showSelectedFile(){
  selectedFile=fileInput.files[0]||null;
  document.getElementById("dzText").innerHTML=selectedFile
    ?'Selected: <span class="dz-file"></span><br>('+formatBytes(selectedFile.size)+')'
    :'Drag &amp; drop a file here<br>or <span class="dz-file">tap to browse</span>';
  if(selectedFile)document.querySelector("#dzText .dz-file").textContent=selectedFile.name;
}
async function uploadFile(){
  if(!user)return toast("Please log in first","error");const file=fileInput.files[0];if(!file)return toast("Choose a file first","error");
  setUploadBtn("Uploading... ⏳",true);
  const safeName=file.name.replace(/[^\w.\- ]/g,"_");
  const uploaderName=(user.user_metadata?.full_name || user.email?.split("@")[0] || "user")
    .trim().replace(/[^\w.-]+/g,"-").replace(/^-+|-+$/g,"") || "user";
  // Include the uploader name in the stored object name so it is visible in Supabase Storage.
  // Keep the user's ID as the folder so the existing per-user storage structure remains intact.
  const path=user.id+"/"+uploaderName+"__"+Date.now()+"_"+safeName;
  const {error}=await db.storage.from("user-files").upload(path,file);
  setUploadBtn("Upload file",false);if(error)return toast(error.message,"error");
  toast("Upload successful! 🚀","success");fileInput.value="";showSelectedFile();await loadFiles();
}
async function loadFiles(){
  if(!user)return;
  const {data,error}=await db.storage.from("user-files").list(user.id,{limit:100,sortBy:{column:"created_at",order:"desc"}});
  if(error)return toast(error.message,"error");
  const box=document.getElementById("files");box.innerHTML="";
  const files=(data||[]).filter(f=>f.id);
  if(!files.length){box.innerHTML='<div class="empty">No files yet — upload your first file! ☁️</div>';return;}
  for(const file of files){
    const row=document.createElement("div");row.className="file-item";
    const name=document.createElement("div");name.className="file-icon";name.textContent=fileEmoji(file.name);
    const meta=document.createElement("div");meta.className="file-meta";
    const fn=document.createElement("div");fn.className="file-name";fn.textContent=file.name.replace(/^[^_]+__\d+_/,"");
    const sub=document.createElement("div");sub.className="file-sub";sub.textContent=formatBytes(file.metadata?.size)+" · "+new Date(file.created_at).toLocaleDateString();
    meta.append(fn,sub);
    const actions=document.createElement("div");actions.className="file-actions";
    const dl=document.createElement("button");dl.className="mini-btn mini-dl";dl.textContent="↓";dl.title="Download";dl.onclick=()=>downloadFile(file.name);
    const del=document.createElement("button");del.className="mini-btn mini-del";del.textContent="✕";del.title="Delete";del.onclick=()=>deleteFile(file.name);
    actions.append(dl,del);row.append(name,meta,actions);box.append(row);
  }
}
async function downloadFile(fileName){
  const {data,error}=await db.storage.from("user-files").download(user.id+"/"+fileName);if(error)return toast(error.message,"error");
  const url=URL.createObjectURL(data),a=document.createElement("a");a.href=url;a.download=fileName.replace(/^[^_]+__\d+_/,"");a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Downloading... 📥","success");
}
async function deleteFile(fileName){
  if(!confirm("Delete this file permanently?"))return;
  const {error}=await db.storage.from("user-files").remove([user.id+"/"+fileName]);if(error)return toast(error.message,"error");
  toast("File deleted 🗑️","success");await loadFiles();
}
init();
</script>
</body>
</html>
