<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCloud Mini</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body {
  min-height:100vh;
  background: linear-gradient(135deg,#0f172a,#1e1b4b,#0f172a);
  background-size: 200% 200%;
  animation: bgMove 12s ease infinite;
  color:#e2e8f0;
  display:flex; justify-content:center;
  padding:24px 14px;
}
@keyframes bgMove { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.card {
  width:100%; max-width:480px;
  background: rgba(30,41,59,.65);
  backdrop-filter: blur(18px);
  border:1px solid rgba(148,163,184,.15);
  border-radius:24px;
  padding:28px 24px;
  height:fit-content;
  box-shadow: 0 25px 60px rgba(0,0,0,.45);
}
.logo { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.logo-icon {
  width:44px; height:44px; border-radius:14px;
  background: linear-gradient(135deg,#38bdf8,#818cf8);
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
h1 { font-size:24px; font-weight:800; letter-spacing:-.5px; }
.sub { color:#94a3b8; font-size:13px; margin-bottom:20px; }
input {
  width:100%; padding:13px 16px; margin:6px 0;
  background:rgba(15,23,42,.7);
  border:1px solid rgba(148,163,184,.2);
  border-radius:12px; color:#e2e8f0; font-size:14px;
  outline:none; transition:.2s;
}
input:focus { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.15); }
input::placeholder { color:#64748b; }
.btn {
  width:100%; padding:13px; margin:6px 0;
  border:none; border-radius:12px;
  font-size:14px; font-weight:700; cursor:pointer;
  transition:.2s;
}
.btn-primary { background:linear-gradient(135deg,#38bdf8,#6366f1); color:#fff; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(56,189,248,.35); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-ghost { background:rgba(148,163,184,.12); color:#cbd5e1; }
.btn-ghost:hover { background:rgba(148,163,184,.22); }
.divider { height:1px; background:rgba(148,163,184,.15); margin:18px 0; }
.userbar {
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin-bottom:16px;
  background:rgba(56,189,248,.08);
  border:1px solid rgba(56,189,248,.2);
  border-radius:14px;
}
.avatar {
  width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg,#38bdf8,#818cf8);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#fff; font-size:16px;
  flex-shrink:0;
}
.user-info { flex:1; min-width:0; }
.user-name { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-email { font-size:12px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn {
  background:rgba(248,113,113,.12); color:#f87171;
  border:none; padding:8px 12px; border-radius:10px;
  font-size:12px; font-weight:700; cursor:pointer;
}
.dropzone {
  border:2px dashed rgba(148,163,184,.3);
  border-radius:16px; padding:28px 16px;
  text-align:center; cursor:pointer;
  transition:.2s; margin-bottom:12px;
}
.dropzone:hover, .dropzone.over {
  border-color:#38bdf8;
  background:rgba(56,189,248,.07);
}
.dropzone .dz-icon { font-size:34px; margin-bottom:6px; }
.dropzone p { font-size:13px; color:#94a3b8; }
.dropzone .dz-file { color:#38bdf8; font-weight:600; }
.file-item {
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin:8px 0;
  background:rgba(15,23,42,.5);
  border:1px solid rgba(148,163,184,.12);
  border-radius:14px;
}
.file-icon { font-size:22px; flex-shrink:0; }
.file-meta { flex:1; min-width:0; }
.file-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file-sub { font-size:11px; color:#64748b; margin-top:2px; }
.file-actions { display:flex; gap:6px; flex-shrink:0; }
.mini-btn {
  border:none; padding:7px 10px; border-radius:9px;
  font-size:12px; font-weight:700; cursor:pointer; transition:.2s;
}
.mini-dl { background:rgba(56,189,248,.15); color:#38bdf8; }
.mini-dl:hover { background:rgba(56,189,248,.28); }
.mini-del { background:rgba(248,113,113,.13); color:#f87171; }
.mini-del:hover { background:rgba(248,113,113,.26); }
.empty { text-align:center; color:#475569; font-size:13px; padding:20px 0; }
.toast {
  position:fixed; left:50%; bottom:28px;
  transform:translateX(-50%) translateY(100px);
  background:#0f172a; color:#e2e8f0;
  border:1px solid rgba(148,163,184,.25);
  padding:12px 22px; border-radius:14px;
  font-size:14px; font-weight:600;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  z-index:99; max-width:90%;
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.error { border-color:#f87171; color:#fca5a5; }
.toast.success { border-color:#4ade80; color:#86efac; }
.hidden { display:none; }
footer { text-align:center; margin-top:18px; font-size:11px; color:#475569; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">☁️</div>
    <div>
      <h1>MyCloud Mini</h1>
    </div>
  </div>
  <p class="sub">Your personal cloud — store &amp; share files securely</p>

  <!-- AUTH SECTION -->
  <div id="authSection">
    <input id="name" type="text" placeholder="Your name">
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password (6+ characters)">
    <button class="btn btn-primary" id="signupBtn" onclick="signup()">Create account</button>
    <button class="btn btn-ghost" onclick="login()">Login</button>
  </div>

  <!-- APP SECTION -->
  <div id="appSection" class="hidden">
    <div class="userbar">
      <div class="avatar" id="avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="userName">—</div>
        <div class="user-email" id="userEmail">—</div>
      </div>
      <button class="icon-btn" onclick="logout()">Logout</button>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="dz-icon">📤</div>
      <p id="dzText">Drag &amp; drop a file here<br>or <span class="dz-file">tap to browse</span></p>
    </div>
    <input id="file" type="file" class="hidden">
    <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()">Upload file</button>
    <button class="btn btn-ghost" onclick="loadFiles()">🔄 Refresh files</button>

    <div class="divider"></div>
    <p style="font-size:12px;color:#64748b;margin-bottom:6px;">YOUR FILES</p>
    <div id="files"></div>
  </div>

  <footer>Learning prototype — do not upload sensitive files.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const db = supabase.createClient(
  "https://nylpeijudbjzocdfiyqe.supabase.co",
  "sb_publishable_CPIurg7CNQRL2yVyyGb0cA_iQp5Sk21"
);
let user = null;
let selectedFile = null;

/* ---------- UI HELPERS ---------- */
function toast(msg, type){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = "toast", 3200);
}
function showSection(){
  const loggedIn = !!user;
  document.getElementById("authSection").classList.toggle("hidden", loggedIn);
  document.getElementById("appSection").classList.toggle("hidden", !loggedIn);
  if(loggedIn){
    const name = user.user_metadata?.full_name || "";
    const email = user.email || "";
    document.getElementById("userName").textContent = name || email.split("@")[0];
    document.getElementById("userEmail").textContent = email;
    document.getElementById("avatar").textContent = (name || email)[0].toUpperCase();
  }
}
function formatBytes(b){
  if(!b && b !== 0) return "";
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b/1024).toFixed(1) + " KB";
  return (b/1048576).toFixed(1) + " MB";
}
function fileEmoji(name){
  const ext = name.split(".").pop().toLowerCase();
  if(["jpg","jpeg","png","gif","webp","svg"].includes(ext)) return "🖼️";
  if(["mp4","mov","avi","mkv"].includes(ext)) return "🎬";
  if(["mp3","wav","ogg","m4a"].includes(ext)) return "🎵";
  if(["pdf"].includes(ext)) return "📕";
  if(["doc","docx","txt","md"].includes(ext)) return "📄";
  if(["xls","xlsx","csv"].includes(ext)) return "📊";
  if(["zip","rar","7z","tar","gz"].includes(ext)) return "📦";
  if(["js","html","css","py","java","json"].includes(ext)) return "💻";
  return "📁";
}
function setUploadBtn(text, disabled){
  const b = document.getElementById("uploadBtn");
  b.textContent = text;
  b.disabled = disabled;
}

/* ---------- AUTH ---------- */
async function init(){
  const {data} = await db.auth.getSession();
  user = data.session?.user || null;
  showSection();
  if(user) await loadFiles();
}
async function signup(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!name) return toast("Please enter your name","error");
  const btn = document.getElementById("signupBtn");
  btn.disabled = true; btn.textContent = "Creating account...";
  const {data,error} = await db.auth.signUp({
    email, password, options:{data:{full_name:name}}
  });
  btn.disabled = false; btn.textContent = "Create account";
  if(error) return toast(error.message,"error");
  user = data.session?.user || null;
  showSection();
  if(user){ toast("Account created! 🎉","success"); await loadFiles(); }
  else toast("Check your email to confirm, then log in.","success");
}
async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const {data,error} = await db.auth.signInWithPassword({email,password});
  if(error) return toast(error.message,"error");
  user = data.user;
  showSection();
  toast("Welcome back! 👋","success");
  await loadFiles();
}
async function logout(){
  await db.auth.signOut();
  user = null;
  document.getElementById("files").innerHTML = "";
  showSection();
  toast("Logged out","success");
}

/* ---------- DROPZONE ---------- */
const dz = document.getElementById("dropzone");
const fileInput = document.getElementById("file");
dz.addEventListener("click", () => fileInput.click());
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
dz.addEventListener("dragleave", () => dz.classList.remove("over"));
dz.addEventListener("drop", e => {
  e.preventDefault(); dz.classList.remove("over");
  if(e.dataTransfer.files.length){
    fileInput.files = e.dataTransfer.files;
    showSelectedFile();
  }
});
fileInput.addEventListener("change", showSelectedFile);
function showSelectedFile(){
  selectedFile = fileInput.files[0] || null;
  document.getElementById("dzText").innerHTML = selectedFile
    ? 'Selected: <span class="dz-file">' + selectedFile.name + '</span><br>(' + formatBytes(selectedFile.size) + ')'
    : 'Drag &amp; drop a file here<br>or <span class="dz-file">tap to browse</span>';
}

/* ---------- FILES ---------- */
async function uploadFile(){
  if(!user) return toast("Please log in first","error");
  const file = fileInput.files[0];
  if(!file) return toast("Choose a file first","error");
  setUploadBtn("Uploading... ⏳", true);
  const safeName = file.name.replace(/[^\w.\- ]/g,"_");
  const path = user.id + "/" + Date.now() + "_" + safeName;
  const {error} = await db.storage.from("user-files").upload(path, file);
  setUploadBtn("Upload file", false);
  if(error) return toast(error.message,"error");
  toast("Upload successful! 🚀","success");
  fileInput.value = "";
  showSelectedFile();
  await loadFiles();
}
async function loadFiles(){
  if(!user) return;
  const {data,error} = await db.storage.from("user-files")
    .list(user.id,{limit:100,sortBy:{column:"created_at",order:"desc"}});
  if(error) return toast(error.message,"error");
  const box = document.getElementById("files");
  box.innerHTML = "";
  const files = (data || []).filter(f => f.id);
  if(!files.length){
    box.innerHTML = '<div class="empty">No files yet — upload your first file! ☁️</div>';
    return;
  }
  for(const file of files){
    const row = document.createElement("div");
    row.className = "file-item";
    const name = document.createElement("div");
    name.className = "file-icon";
    name.textContent = fileEmoji(file.name);
    const meta = document.createElement("div");
    meta.className = "file-meta";
    const fn = document.createElement("div");
    fn.className = "file-name";
    fn.textContent = file.name.replace(/^\d+_/, "");
    const sub = document.createElement("div");
    sub.className = "file-sub";
    sub.textContent = formatBytes(file.metadata?.size) + " · " + new Date(file.created_at).toLocaleDateString();
    meta.append(fn, sub);
    const actions = document.createElement("div");
    actions.className = "file-actions";
    const dl = document.createElement("button");
    dl.className = "mini-btn mini-dl";
    dl.textContent = "↓";
    dl.title = "Download";
    dl.onclick = () => downloadFile(file.name);
    const del = document.createElement("button");
    del.className = "mini-btn mini-del";
    del.textContent = "✕";
    del.title = "Delete";
    del.onclick = () => deleteFile(file.name);
    actions.append(dl, del);
    row.append(name, meta, actions);
    box.append(row);
  }
}
async function downloadFile(fileName){
  const {data,error} = await db.storage.from("user-files")
    .download(user.id + "/" + fileName);
  if(error) return toast(error.message,"error");
  const url = URL.createObjectURL(data);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Downloading... 📥","success");
}
async function deleteFile(fileName){
  if(!confirm("Delete this file permanently?")) return;
  const {error} = await db.storage.from("user-files")
    .remove([user.id + "/" + fileName]);
  if(error) return toast(error.message,"error");
  toast("File deleted 🗑️","success");
  await loadFiles();
}
init();
</script>
</body>
  </html>
